name: Autonomous QA Multi-Agent Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Todos os dias às 03:00 UTC

permissions:
  issues: write
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Run Unit & Business Rule Tests (Pytest)
        run: |
          PYTHONPATH=. pytest tests/ -q

  test-persona:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        persona:
          - qa_adversarial
          - eleitor_leigo
          - jornalista_politico
          - pesquisador_academico
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Agente Testador de RAG-AI (${{ matrix.persona }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=. python3 scripts/agent_rag_tester.py --persona ${{ matrix.persona }}

  triage:
    needs: test-persona
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Triage (Agente Engenheiro)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/agent_triage.py

      - name: Relatório de Observabilidade
        run: |
          echo "### 📊 Relatório da Rodada de QA Autônomo" >> $GITHUB_STEP_SUMMARY
          echo "- **Data**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Pipeline Status**: Sucesso" >> $GITHUB_STEP_SUMMARY
