name: Geração de Prompts Dinâmicos (Cronjob LLM)

on:
  schedule:
    - cron: '0 8 * * 1' # Toda segunda-feira às 08:00 UTC
  workflow_dispatch: # Permite execução manual

jobs:
  budget:
    uses: ./.github/workflows/_actions-budget.yml
    secrets:
      ACTIONS_BILLING_TOKEN: ${{ secrets.ACTIONS_BILLING_TOKEN }}
  generate-prompts:
    needs: budget
    if: needs.budget.outputs.has_budget == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gerar Prompts Dinâmicos
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd pipelines/ingestion
          python generate_dynamic_prompts.py --output ../../backend/api/curated_prompts.json

      - name: Abrir Pull Request caso haja mudanças
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ux): atualiza sugestões dinâmicas via cronjob LLM"
          branch: chore/prompts-dinamicos
          delete-branch: true
          title: "chore(ux): atualiza sugestões dinâmicas via cronjob LLM"
          body: |
            Atualização automática das sugestões dinâmicas gerada pelo cronjob semanal.
            Requer revisão humana antes do merge na `main`.
          base: main
