name: Ingestão Semanal - TSE DivulgaCandContas (Prestação de Contas)

on:
  schedule:
    - cron: '0 2 * * 0' # Executa semanalmente aos domingos às 02:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_VERSION: node24
  NODE_OPTIONS: "--no-warnings"

jobs:
  ingest-tse-divulgacand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install --prefer-binary -r requirements.txt

      - name: Run TSE DivulgaCand Scraper
        run: python pipelines/scrapers/scraper_tse_divulgacand.py

      - name: Ingest to Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: python pipelines/ingestion/pinecone_ingestor.py
