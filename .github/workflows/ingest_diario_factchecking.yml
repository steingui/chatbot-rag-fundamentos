name: Ingestão Diária - Fact Checking (RSS Multi-Agências)

on:
  schedule:
    - cron: '0 5 * * *' # Executa diariamente às 05:00 UTC
  workflow_dispatch:

jobs:
  ingest-factchecking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pinecone-client sentence-transformers langchain-pinecone langchain-huggingface python-dotenv

      - name: Run Fact-Checking RSS Scraper
        run: python pipelines/scrapers/scraper_rss.py

      - name: Ingest to Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: python pipelines/ingestion/pinecone_ingestor.py
