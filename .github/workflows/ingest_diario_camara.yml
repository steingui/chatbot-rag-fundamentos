name: Ingestão Diária - Câmara dos Deputados

on:
  schedule:
    # Roda a cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_VERSION: node24

jobs:
  ingest-camara:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install --prefer-binary -r requirements.txt

      - name: Run Scraper (Câmara)
        run: python pipelines/scrapers/scraper_camara.py

      - name: Run Ingest (Pinecone)
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python pipelines/ingestion/pinecone_ingestor.py
