name: Ingestão Mensal - PDFs e Planos de Governo (TSE)

on:
  schedule:
    # Roda no dia 1 de todo mês, à meia-noite UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  ingest-estaticos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install --prefer-binary -r requirements.txt

      - name: Run Scraper (TSE PDFs / Limpeza)
        run: python pipelines/scrapers/scraper_tse_pdfs.py

      - name: Run Ingest (Pinecone)
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python pipelines/ingestion/pinecone_ingestor.py
