name: Ingestão Diária - Querido Diário (Atos Municipais)

on:
  schedule:
    - cron: '0 3 * * *' # Executa diariamente às 03:00 UTC
  workflow_dispatch:

jobs:
  ingest-querido-diario:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pinecone-client sentence-transformers langchain-pinecone langchain-huggingface python-dotenv

      - name: Run Querido Diário Scraper
        run: python pipelines/scrapers/scraper_querido_diario.py

      - name: Ingest to Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: python pipelines/ingestion/pinecone_ingestor.py
