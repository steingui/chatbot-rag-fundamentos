name: Monitoramento Autônomo e Auto-Cura de Ingestões

on:
  schedule:
    - cron: '0 7 * * *' # Executa diariamente às 07:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_VERSION: node24

jobs:
  monitor-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pinecone-client sentence-transformers langchain-community langchain-pinecone langchain-huggingface langchain-google-genai google-generativeai python-dotenv

      - name: Run Monitor & Heal Audit
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python pipelines/ingestion/monitor_and_heal.py

      - name: Re-Ingest Fixed Documents to Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: python pipelines/ingestion/pinecone_ingestor.py

      - name: Create Pull Request with Auto-Healed Fixes & Health Report
        if: steps.audit.outputs.should_commit == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[LLM-AUTOCURE] fix(ingestion): auto-heal data quality & pipeline health report"
          branch: auto-heal/pipeline-fix
          title: "[LLM-AUTOCURE] Diagnóstico e Correção Autônoma de Ingestão"
          body-path: 'data/docs/pipeline_health_report.md'
          labels: 'autocure, pipeline-health'
          delete-branch: true
