name: Monitor de Erros do Backend (Cloud Run)

on:
  schedule:
    # A cada 3 horas (180 min), no minuto 0
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: rag-eleicoes
  GCP_REGION: southamerica-east1
  GCP_SERVICE: chatbot-rag-api

jobs:
  budget:
    uses: ./.github/workflows/_actions-budget.yml
    secrets:
      ACTIONS_BILLING_TOKEN: ${{ secrets.ACTIONS_BILLING_TOKEN }}
  monitor:
    needs: budget
    if: needs.budget.outputs.has_budget == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Authenticate no Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Instalar dependências
        run: pip install requests

      - name: Analisar logs e abrir issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/backend_log_monitor.py --since-minutes 185
