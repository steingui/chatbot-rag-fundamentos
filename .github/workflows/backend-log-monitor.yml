name: Monitor de Erros do Backend (Cloud Run)

on:
  schedule:
    # A cada 3 horas (180 min), no minuto 0
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: rag-eleicoes
  GCP_REGION: southamerica-east1
  GCP_SERVICE: chatbot-rag-api

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate no Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Instalar dependências
        run: pip install requests

      - name: Analisar logs e abrir issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/backend_log_monitor.py --since-minutes 185
